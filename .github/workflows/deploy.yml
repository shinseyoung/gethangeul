# Builds the site and publishes it to GitHub Pages on every push to main.
#
# Turn it on once, by hand: Settings -> Pages -> Source -> GitHub Actions.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a queued run is not worth cancelling a live one for
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tries to turn Pages on so the first deploy needs nobody in Settings.
      # The job token is not always allowed to, and when it is not this step
      # is the wrong thing to fail a build over: the artifact is still good,
      # and the deploy below will pick it up as soon as Pages is on.
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          # A project page serves from /<repo>/. Once ganada.com points here,
          # set a repository variable BASE_PATH to / and this follows.
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
      # Pages has no rewrite rule, so a deep link like /ko/kdrama is a 404 on
      # the server. Serving index.html as the 404 page hands those to the app,
      # which reads the address itself and opens the right room.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
